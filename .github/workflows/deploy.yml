name: deploy
on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run qa

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: fogpipe/cloud-actions/auth@v1
        with:
          service-account: a41e68ad-192a-4d38-aa77-0c65b48c6446

      - id: registry
        uses: fogpipe/cloud-actions/registry-login@v1

      - name: Build & push
        run: |
          IMG="${{ steps.registry.outputs.repository }}/signaling:${{ github.sha }}"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> "$GITHUB_ENV"

      - uses: fogpipe/cloud-actions/deploy@v1
        with:
          project: games
          app: signaling
          image: ${{ env.IMAGE }}
          port: "3000"
          ingress: all
